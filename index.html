<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Dark AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080808;
            color: white;
        }

        .app {
            max-width: 700px;
            margin: auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px;
            border-bottom: 1px solid #222;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            color: #888;
            margin-bottom: 0;
        }

        #chat {
            flex: 1;
            padding: 20px;
        }

        .message {
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .ai {
            background: #151515;
        }

        .user {
            background: #202020;
            text-align: right;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #222;
            position: sticky;
            bottom: 0;
            background: #080808;
        }

        input {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #111;
            color: white;
            outline: none;
        }

        button {
            padding: 14px 18px;
            border: none;
            border-radius: 10px;
            background: white;
            color: black;
            font-weight: bold;
        }
        .new-chat-btn {
    background: #111;
    color: #fff;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    margin: 12px;
}

.new-chat-btn:hover {
    background: #222;
}
    </style>
</head>

<body>
<button class="new-chat-btn" onclick="startNewChat()">New Chat</button>
<div class="app">

    <header>
        <h1>⚫ Web3 Dark AI</h1>
        <p>Web3 intelligence • Research • On-chain analysis</p>
    </header>

    <div id="chat">

        <div class="message ai">
            I'm ready. Ask me about a crypto project, token, wallet,
            protocol, or Web3 topic.
        </div>

    </div>

    <div class="input-area">
        <input
            id="message"
            type="text"
            placeholder="Ask your Web3 AI..."
        >

        <button onclick="sendMessage()">
            Send
        </button>
    </div>

</div>

<script>
// ===============================
// LOCAL CHAT HISTORY
// ===============================

let chatHistory = JSON.parse(
    localStorage.getItem("web3DarkAI_history") || "[]"
);

function saveChatHistory() {
    localStorage.setItem(
        "web3DarkAI_history",
        JSON.stringify(chatHistory)
    );
}

function loadChatHistory() {
    const chat = document.getElementById("chat");

    if (!chat) return;

    chatHistory.forEach((item) => {
        const message = document.createElement("div");

        message.className =
            item.role === "user"
                ? "message user"
                : "message ai";

        message.textContent = item.content;

        chat.appendChild(message);
    });

    chat.scrollTop = chat.scrollHeight;
}
window.addEventListener("load", loadChatHistory);
    function startNewChat() {
    localStorage.removeItem("web3DarkAI_history");
    chatHistory = [];

    const chat = document.getElementById("chat");
    chat.innerHTML = "";
    }
async function sendMessage() {
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");

    const message = input.value.trim();

    if (!message) return;

    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = message;
    chat.appendChild(userMessage);
chatHistory.push({
    role: "user",
    content: message
});

saveChatHistory();
    input.value = "";

    const aiMessage = document.createElement("div");
    aiMessage.className = "message ai";
    aiMessage.textContent = "Thinking...";
    chat.appendChild(aiMessage);

    // Get the conversation currently visible in the browser
    const messages = [];

    chat.querySelectorAll(".message").forEach((element) => {
        const role = element.classList.contains("user")
            ? "user"
            : "assistant";

        const content = element.textContent;

        // Don't send the temporary "Thinking..." message
        if (content !== "Thinking...") {
            messages.push({
                role: role,
                content: content
            });
        }
    });

    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message,
                history: messages.slice(0, -1)
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "Request failed"
            );
        }

        aiMessage.textContent = data.answer;
chatHistory.push({
    role: "assistant",
    content: data.answer
});

saveChatHistory();
    } catch (error) {
        aiMessage.textContent =
            "Something went wrong: " +
            error.message;
    }

    chat.scrollTop = chat.scrollHeight;
    }

</script>

</body>
</html>
